[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-blackjack"
version = "0.2.0"
description = "Rule-perturbation blackjack with a Chaos AI agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["pygame>=2.5"]
# Art pipeline (scripts/asset_tools.py); validation and previews need only pygame.
art = ["pygame>=2.5", "pillow>=10", "numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["chaos_blackjack*"]

[tool.setuptools.package-data]
chaos_blackjack = ["py.typed"]
"chaos_blackjack.ai" = ["prompts/*.txt", "permissions/*.json"]
