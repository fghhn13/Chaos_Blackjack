limit_req_zone $binary_remote_addr zone=blackjack_auth:10m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name 43.153.209.136;
    location /.well-known/acme-challenge/ { root /var/www/chaos-acme; }
    location / { return 301 https://43.153.209.136$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 43.153.209.136;
    ssl_certificate /etc/letsencrypt/live/43.153.209.136/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.153.209.136/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BlackjackTLS:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8k;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    location ~ ^/api/(login|register)$ {
        limit_req zone=blackjack_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8088;
        proxy_read_timeout 45s;
    }
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_read_timeout 45s;
    }
}
