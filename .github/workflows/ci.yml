name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never call the paid LLM relay from CI; GUI tests run headless.
  CHAOS_USE_LLM: "0"
  CHAOS_DB: ":memory:"
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONUTF8: "1"

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,gui,art]"

      - name: Tests
        run: python -m pytest

      - name: Integrated application smoke (offline)
        run: python scripts/ci_smoke.py --gui

      - name: Content and sound assets
        run: |
          python -m chaos_blackjack.content validate example
          python -m chaos_blackjack.audio validate
          python scripts/export_sounds.py --verify

      - name: CLI smoke (offline)
        shell: bash
        run: |
          python cli/main.py demo
          python scripts/debug_smoke.py
          python -m chaos_blackjack.agent --state "$RUNNER_TEMP/run.json" new --seed 7
          python -m chaos_blackjack.agent --state "$RUNNER_TEMP/run.json" --brief bet 10
          python -m chaos_blackjack.agent --state "$RUNNER_TEMP/run.json" --brief act stand
          CHAOS_DB="$RUNNER_TEMP/game.db" python -m chaos_blackjack.data saves
          CHAOS_DB="$RUNNER_TEMP/game.db" python -m chaos_blackjack.data show default | grep -q "reward.first_win.tokens"

  package:
    name: Installed wheel (offline runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel with GUI support
        run: python -m pip install dist/*.whl pygame
      - name: Check installation outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/ci_smoke.py" --installed --gui
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
