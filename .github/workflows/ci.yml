name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never call the paid LLM relay from CI; GUI tests run headless.
  CHAOS_USE_LLM: "0"
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONUTF8: "1"

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,gui]"

      - name: Tests
        run: python -m pytest

      - name: CLI smoke (offline)
        shell: bash
        run: |
          python cli/main.py demo
          python scripts/debug_smoke.py
          python -m chaos_blackjack.agent --state "$RUNNER_TEMP/run.json" new --seed 7
          python -m chaos_blackjack.agent --state "$RUNNER_TEMP/run.json" --brief bet 10
          python -m chaos_blackjack.agent --state "$RUNNER_TEMP/run.json" --brief act stand
