# Chaos Blackjack — conda environment
# Usage (from the project root):
#   conda env create -f environment.yml
#   conda activate chaos-blackjack
#   pip install -e .

name: chaos-blackjack
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - pip
  - setuptools>=61
  - pip:
    - pytest>=7.0
    - pygame>=2.5
